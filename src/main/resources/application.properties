spring.application.name=SpacecraftManagementSystem



spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.defer-datasource-initialization=true
####### Por si quiero utilizar la consola h2 (eliminable)
spring.h2.console.enabled=true

###### Para crear las tablas/entitades de mis clases a base de datos (eliminable si tengo una base de datos externa ya establecida)
spring.jpa.hibernate.ddl-auto=create
###### Para verificar las sql que estoy haciendo durante mis pruebas (eliminable)
spring.jpa.show-sql=true

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

###### Fase 7.1 (2026-09-18): email de confirmacion/cancelacion via Resend (API HTTP, puerto 443) en vez
###### de SMTP directo. Render bloquea el trafico saliente a los puertos SMTP (25/465/587) en los planes
###### Free desde el 26/09/2025 - por eso JavaMailSender nunca conectaba a smtp.gmail.com en produccion
###### (timeout de conexion, no de credenciales); Resend evita el problema porque va por HTTPS.
###### RESEND_API_KEY se configura como variable de entorno (local y en Render), nunca hardcodeada aqui.
###### RESEND_FROM: mientras no se verifique un dominio propio en Resend, dejar "onboarding@resend.dev" -
###### con esa direccion Resend SOLO entrega a la casilla con la que te registraste en Resend (cualquier
###### otro destinatario da 403); normal para probar la demo, no serviria para compradores reales.
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}

###### Fase de integracion: cobro real de entradas de naveSpace con BankIn.
###### BANKIN_API_BASE: local = http://localhost:8000, produccion (Render) = https://bankinback.onrender.com
###### BANKIN_API_KEY solo hace falta si BankIn tiene EXTERNAL_API_KEY configurada; si no, se deja vacia.
###### Nunca hardcodear el valor real aqui - se configura como variable de entorno (local y en Render).
bankin.api.base=${BANKIN_API_BASE:http://localhost:8000}
bankin.api.key=${BANKIN_API_KEY:}

server.port=${PORT:8080}
