spring.application.name=SpacecraftManagementSystem



spring.datasource.url=jdbc:sqlite:./data/spacecraft.db
spring.datasource.driverClassName=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.defer-datasource-initialization=false
####### H2 console deshabilitada (ahora SQLite file, no mem)
spring.h2.console.enabled=false

###### SQLite file persiste entre reinicios: update crea/actualiza sin borrar
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
###### Para verificar las sql que estoy haciendo durante mis pruebas (eliminable)
spring.jpa.show-sql=true

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

###### Fase 2: SMTP para el email de confirmacion (best-effort, no bloquea la compra si falla).
###### Las credenciales reales se configuran como variables de entorno en Render (MAIL_HOST/MAIL_PORT/MAIL_USERNAME/MAIL_PASSWORD),
###### nunca hardcodeadas aqui. Sin esas variables, el host de prueba de Mailtrap solo fallara el envio (se registra en el log).
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

###### Fase de integracion: cobro real de entradas de naveSpace con BankIn.
###### BANKIN_API_BASE: local = http://localhost:8000, produccion (Render) = https://bankinback.onrender.com
###### BANKIN_API_KEY solo hace falta si BankIn tiene EXTERNAL_API_KEY configurada; si no, se deja vacia.
###### Nunca hardcodear el valor real aqui - se configura como variable de entorno (local y en Render).
bankin.api.base=${BANKIN_API_BASE:http://localhost:8000}
bankin.api.key=${BANKIN_API_KEY:}

###### Fase 1 (extraccion del taller a backend Python): aviso a spacecraft-taller-backend cuando
###### una nave es enviada a reparar (POST /api/internal/repairs).
###### TALLER_API_BASE: local = http://localhost:8001, produccion (Render) = URL del servicio nuevo.
###### TALLER_INTERNAL_API_KEY debe coincidir con la misma variable configurada en spacecraft-taller-backend
###### (a diferencia de BankIn, este canal SIEMPRE exige la clave - nunca dejarla vacia en produccion).
###### Nunca hardcodear el valor real aqui - se configura como variable de entorno (local y en Render).
taller.api.base=${TALLER_API_BASE:http://localhost:8001}
taller.api.internal-key=${TALLER_INTERNAL_API_KEY:}

server.port=${PORT:8080}
