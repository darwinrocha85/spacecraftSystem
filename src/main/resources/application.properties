spring.application.name=SpacecraftManagementSystem



spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.defer-datasource-initialization=true
####### Por si quiero utilizar la consola h2 (eliminable)
spring.h2.console.enabled=true

###### Para crear las tablas/entitades de mis clases a base de datos (eliminable si tengo una base de datos externa ya establecida)
spring.jpa.hibernate.ddl-auto=create
###### Para verificar las sql que estoy haciendo durante mis pruebas (eliminable)
spring.jpa.show-sql=true

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

###### Fase 2: SMTP para el email de confirmacion (best-effort, no bloquea la compra si falla).
###### Las credenciales reales se configuran como variables de entorno en Render (MAIL_HOST/MAIL_PORT/MAIL_USERNAME/MAIL_PASSWORD),
###### nunca hardcodeadas aqui. Sin esas variables, el host de prueba de Mailtrap solo fallara el envio (se registra en el log).
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

server.port=${PORT:8080}
